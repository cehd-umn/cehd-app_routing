<div class="row">
    <div class="container">
        <p>Figures display inline-block. The font color is <samp>#555</samp>.</p>
        <p>The <samp>figcaption</samp> displays block. The font size for both is 15px.</p>
        <pre><code class="html">
&lt;figure&gt;
    &lt;img src=&quot;/assets/images/examples/example.jpg&quot; alt=&quot;Example image.&quot;&gt;
    &lt;figcaption&gt;Example image&lt;/figcaption&gt;
&lt;/figure&gt;
        </code></pre>
        <div class="span-6 margin-top-1">
            <figure>
                <img src="/assets/images/examples/example.jpg" alt="Example image.">
                <figcaption>Example image</figcaption>
            </figure>
        </div>
       </div>
    </div>
</div>
