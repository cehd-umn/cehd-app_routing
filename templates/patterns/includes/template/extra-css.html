<p>If you need to create a brand new style that you can't find here,
there's <a
href="http://twig.sensiolabs.org/doc/templates.html#template-inheritance">a
Twig template block</a> for that.</p>

<pre><code class="html">
{% verbatim %}{% block extra_css %}
&lt;style&gt;
    .special-snowflake {
        color: white;
    }
&lt;/style&gt;
{% endblock %}{% endverbatim %}
</code></pre>
