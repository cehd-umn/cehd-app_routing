{% extends "olpd/layout/base.html" %}
{% set page_title = "Faculty & Instructors" %}
{% block title %}{{ page_title }}{% endblock %}
{% block main_content %}
<div id="person-container" class="loader-container" aria-live="polite"
    data-person-with-extra-app
    data-internet-id="{{ internet_id }}"
    data-target-element-selector="#person-container"
    data-template-path="/assets/dist/views/olpd/people/"
    data-extra-data-url="{{ config.base_url }}/data/people/"
    data-extra-data-data='{ "internetId": "{{ internet_id }}" }'
    data-template-name="person-page.html">
    <div class="loader">
        <div class="loader-figure "></div>
        <p class="loader-label">Loading&hellip;</p>
    </div>
</div>
{% endblock %}
{% block bottom_js %}{{ parent() }}
<script src="/assets/dist/js/people.min.js"></script>
{% endblock %}
