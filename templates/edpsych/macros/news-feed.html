{%- macro news_feed_js(feed_path, target_element_selector="#news-container", template_name="index.html", limit=3) -%}
<script>
    (function() {
        "use strict";
        var base_url = "/edpsych/services/news/feed/";
        var params = {
            url: base_url,
            data: {
                "feed-path": "{{ feed_path }}"
            }
        };
        var client = new HTTPClient();
        var $request = client.get(params);

        $request.done(function() {
            var results = client.getResults();
            var news_site_base_url = "http://news.cehd.umn.edu/";
            var news_category_uri = Helpers.feedPathToLinkPath("{{ feed_path }}");
            var news_link = news_site_base_url + news_category_uri;
            var template_params = {
                "template_path": "{{ config.nunjucks_view_base }}/edpsych/newsfeeds/",
                "template_name": "{{ template_name }}",
                "$target_element": $("{{ target_element_selector }}"),
                "data": {
                    news: results,
                    more_news_link: news_link,
                    limit: {{ limit }},
                    config: {{ config|json_encode|raw }} // passes Twig config info for use in Nunjucks templates
                }
            };
            var renderer = new Renderer();
            renderer.init(template_params);
            renderer.render();
        });
    })();
</script>
{%- endmacro -%}
