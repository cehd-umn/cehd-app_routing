<div id="breadcrumb">
    <div class="row ">
        <div class="container">
            <div id="siteBreadcrumb">
                <ol class="breadcrumb">
                    <li><a href="/edpsych/">Home</a></li>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
                    <script>
                        var path = "";
                        var href = document.location.href;
                        var s = href.split("/");
                        console.log(s);

                        for (var i = 4; i < s.length - 1; i++) {
                            console.log(path);
                            path +=
                                '<LI><A HREF="' +
                                href.substring(0, href.indexOf("/" + s[i]) + s[i].length + 1) +
                                '/">' +
                                s[i].replace("-", " ") +
                                "</A></LI>";
                            console.log(path);
                        }
                        i = s.length - 1;
                        console.log(i)
                        path +=
                            '<A HREF="' +
                            href.substring(0, href.indexOf(s[i]) + s[i].length) +
                            '">' +
                            s[i] +
                            "</A>";

                        var url = path;
                        document.writeln(url);
                        console.log(url);
                    </script>
                </ol>
            </div>
        </div>
    </div>
</div>
