            <div class="container">
                <h2>YDL alumni spotlight</h2>

                    <h3><small><a href="mailto:tlindse@ksu.edu">tlindse@ksu.edu</a></small></h3>
                    </div>
                    </div>
                    <div class="half">
                    <p>Trumanue arrived at the Youth Development Leadership (YDL) program as an associate within the Multicultural Center for Academic Excellence at the University of Minnesota. Looking to further his education and career in higher education, Trumanue enrolled in the fall of 2007 in the YDL Master’s program. During his time in the program, he focused his studies on youth development theory, experiential learning and youth work through web design. Upon graduating from the YDL program in 2010, Trumanue held various roles as an Academic Advisor and Coordinator at numerous community colleges in the Twin Cities area before leaving this past fall (2018) for his current role as the Director of Diversity & Multicultural Student Life at Kansas State University. For the past several years students have voiced their concerns to administration on how to make a more welcoming and inclusive environment for diverse student populations at Kansas State University. </p></div>
                    <div class="half">
                    <p>Included in those concerns have been a lack of diverse representation in key administrator roles across campus and a lack adequate space devoted for multicultural students on campus. Hearing the needs of the students; just within the past couple of years, K-State has been able to create and hire upper level positions to further support the recruitment, retention and graduation of multicultural students on campus. In addition to that, the Kansas Board of Regents recently approved the building of a brand new Multicultural Student Center. The center will be a 14,000 sq ft building that will sit adjacent to the student union. With the continued support from our corporate partners, alumni and community, the privately funded structure has a groundbreaking timeline of summer 2019 with a fall 2020 open.</p>
                    </div>
            </div>



            <div class="container">
              <div class="half">
                  <div class="span-4">
                  <img class="circular" src="/ssw/images/walz.png" alt="Photo of Lindsay Walz">
                  </div>
                  <div class="span-8">
                  <h2><small>Lindsay Walz</small></h2>
                  
                  </div>
                  </div>
                  <div class="half">
                  <p>Lindsay Walz graduated from the University of Minnesota Twin Cities with her Masters in Youth Development Leadership (YDL) in 2013 and her bachelors in Family Social Science and a minor in Youth Studies in 2005. Lindsay’s interest in working with youth stemmed from her personal experience when she was invited to join the board of directors of a non-profit organization at the age of 16. This initial invitation started with free pizza but quickly turned to an opportunity that further inspired her to do the work she currently does today. The experience of feeling heard and valued for her contributions at a young age, provided Lindsay with the tools and confidence to pursue her aspirations to create an organization where youth could lead the way. </p> <p>After graduating with her bachelor’s degree, she worked at a group home teaching Independent Living Skills to youth aging out of foster care. A few years into her career, she realized that she needed to return to school for more grounding in youth work. Just before her YDL experience began, life as she knew it came crashing down when the  35W bridge collapsed. Surviving the collapse offered her a parallel experience to many of the young people she was working with who were impacted by their own forms of trauma.  Healing her own PTSD came into sharp focus during her years in YDL and strongly influenced the direction she took her youth work.  In her years of recovery, she leaned on the healing power of art and was emboldened to ensure young people could access those same transformative practices.</p></div>
                  <div class="half">
                  <p>Soon after graduating with her Masters degree, she founded Courageous heARTS. Courageous heARTS mission is to illuminate youth as leaders while inspiring creativity, courage. and collaboration throughout the whole community. The organization operates an art studio in south Minneapolis that is led by youth (through their Youth Advisory Board and Creative Community Apprenticeship), where the whole community can access creative tools for  personal expression. Lindsay’s YDL roots guide the strategic direction of the organization through their focus on youth leadership, personal transformation, and connection to community.</p><p>She hopes to provide anyone and everyone an opportunity to create something whether they feel creative or not- she’s the first to acknowledge her self-doubts in this area! She invites you to participate and learn more about her organization.  If anyone is interested in learning more, please feel free to contact Lindsay or check out courageous heARTS. She would be more than happy to connect with you!</p>
                  </div>
          </div>





            <div class="container">
                <h2>YDL current student spotlight</h2>
                <div class="half">
                    <div class="span-4">
                        <img class="circular" src="/ssw/images/payton.png" alt="Photo of Payton Jordahl">
                        </div>
                    
                    <div class="span-8">
                    <h2><small>Payton Jordahl, class of '19 </small></h2>
                    <h3><small><a href="mailto:	jorda631@umn.edu">jorda631@umn.edu</a></small></h3>
                    </div>
                    </div>
                    <div class="half">
                        <p>Payton Jordahl, a student in his second year of the MEd in Youth Development Leadership program, is doing qualitative research on the identity change experienced by student athletes at the end of their sports careers. Inspired in part by his own experience in football, and some past research he did in that program, he hopes to help others become prepared for the transitions they face. Through a series of in-depth interviews, he has found that strong evidence for the mental health impact of such a change. Though he is still in the process of pulling together his main points and comparing it with the current literature, he already feels strongly that more research in this area still needs to be done. As Payton says, “I am starting to realize that this is a field that seems widely researched at the surface but doesn’t seem to produce real solutions or ideas to make the transition easier for former athletes.”</p></div>
          <div class="half">
            <p>Though the conversations he’s had during these interviews have been full raw mental health issues and strong emotions, he’s really enjoyed getting to know each athlete and being constantly challenged to stay present and aware of potentially triggering questions. He hopes that his work will result in a proposal for a class or education program that prepares athletes for the major life changes they face when retiring from sports. The process is still on-going, however, and he is excited to see what else he may find. Look for more information during his presentation on his results in the spring!
              </p>
          </div>
          </div>

          <div class="container">
            <h2> Q &amp; A with Erin Sugrue (MSW, PhD 18’ Alumni)</h2>
            <div class="half">
                <div class="span-4">
                <img class="circular" src="/ssw/images/erin.png" alt="Photo of Erin Sugrue">
                </div>
                <div class="span-8">
                <h2><small>Erin Sugrue</small></h2>
                
                </div>
                </div>
                <div class="half">
                <p>Dr. Erin Sugrue, PhD, LICSW is an assistant professor of social work at Augsburg
                    University. Prior to receiving her doctorate, Dr. Sugrue worked for over a decade as a
                    school social worker in the Edina Public Schools and did on-call social work at
                    Children’s Hospitals and Clinics of Minnesota. Her research and teaching interests
                    include school social work, child welfare system reform, race and racialization in social
                    work practice, and clinical social work as social justice practice. Dr. Sugrue’s study on
                    moral injury among educators was recently published at the American Educational
                    Research Journal and was highlighted in the news site <a href="http://blogs.edweek.org/teachers/teaching_now/2019/05/moral_injury_teachers.html?fbclid=IwAR1R0rAisSQ8x3McMd1DLaPuZZkCEL8GNQNa8dIGIrdFKkBaBqR6E4hj45U"></a>Education Week.</a></p></div>

                <div class="half">
                <p><em>What was your overall experience in the PhD program at SSW?</em></p>
                <p>The PhD program was very challenging in many ways, but I am so thankful that I
                    had the opportunity to pursue my doctorate.  It is truly a privilege to get to study,
                    write, discuss, and teach on topics about which I care deeply.  I am grateful for
                    the variety of research skills I developed and the grounding I gained in social
                    theories. I also appreciated the ability to attend so many national conferences,
                    which allowed me to meet other social work scholars, present my own work, and
                    learn about all the interesting research going on in our field. Finally, I loved the
                    relationships I built with other PhD students, especially my cohort -- we&#39;ve seen
                    each other through some rough times and we are each other&#39;s biggest
                    cheerleaders and supporters.</p>

                <p><em></em></p>
                <p></p>

                <p><em>What are you currently doing now and how has the program prepared you for
                    your current work?</em></p>
                <p>I&#39;m currently an assistant professor in the Department of Social Work at
                    Augsburg University in Minneapolis.  I love my job.  So much of what I learned
                    and experienced in the PhD program helped prepare me for this job.  In terms of
                    coursework, we are a teaching university, so the course we take on teaching in
                    higher education was extremely helpful.  Our program is very theory-driven, so
                    theory courses I took gave me a good grounding for teaching.  Additionally, I
                    continue to be engaged in multiple scholarship projects, thus the research skills I
                    learned and the connections and relationships I built while in the PhD program
                    have been critical in helping me keep a focus on both research and teaching. 
                    The most interesting part of my work is working with the diverse and dedicated
                    students at Augsburg, at both the undergraduate and graduate level.  I love
                    social work and I love social workers, so it&#39;s thrilling and inspiring to me to work
                    with students who have such rich life experiences, diverse perspectives and
                    interests, and who are so dedicated to our field.</p>

                <p><em>What advice would you give to students interested in pursuing a PhD program at
                    the UMN SSW?</em></p>
                <p>For future potential PhD students: Keep in mind that this is a research degree,
                    not a practice degree.  If you don&#39;t want a job in academia or in a academia-
                    adjacent research institute, then I wouldn&#39;t pursue the PhD -- a practice degree it
                    is not.  That being said, if your goal is to teach future social work students and/or
                    research important social issues and work with like-minded colleagues, the pain
                    and suffering of completing a PhD (and there is pain and suffering!) is definitely
                    worth it.  I am really thrilled to be working where I am and in a field that I love.</p>

                <p><em>Tell us something fun about yourself!</em></p>
                <p>I used to be a folksinger (kind of)! I was in a folk duo in college in the 90&#39;s (think
                    Indigo Girls mixed w/some Ani Difranco &amp; Dar Williams). In my early 20&#39;s, I used
                    to play the open mic scene in Boston and then when I came to the U of MN for
                    my MSW, I would get coffee shop gigs around the Twin Cities.  My MSW
                    classmates were some of my loyal fans at the time (social workers are so
                    supportive)!  Now my kids will sometimes sing harmonies with me!</p>
