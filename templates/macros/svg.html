{%- macro did_you_know(variables, title, description, text_lines) -%}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 170" aria-labelledby="title" aria-describedby="title desc" role="img">
    <defs>
        <style>{{ variables.inline_svg_styles|raw }}</style>
    </defs>
    <title>{{ title }}</title>
    <desc>{{ description }}</desc>
    <g id="img">
        <text class="text-did-you-know-title" transform="translate(42.77 54.58)">
            Did
            <tspan x="-3.14" y="48">you</tspan>
            <tspan x="-42.77" y="96">know</tspan>
        </text>
        <line class="vertical-stroke" x1="128.35" x2="128.35" y2="170"/>
        <text class="text-did-you-know-text" transform="translate(141 {{ 170/(text_lines|length) }})">
            {%- set y = 0 -%}
            {%- for line in text_lines -%}
                <tspan x="0" y="{{ y }}">{{ line }}</tspan>{% set y = y +  34 -%}
            {%- endfor -%}
        </text>
    </g>
</svg>
{%- endmacro -%}
