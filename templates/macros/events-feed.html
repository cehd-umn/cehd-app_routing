{%- macro events_feed_js(
    t,
    limit=4,
    target_element_selector="#events-container",
    template_path="/assets/dist/views/cehd/events",
    template_name="index.html",
    q=6,
    r=3
    ) -%}
<script>
    (function() {
        "use strict";
        var base_url = "/services/events/feed/";
        var params = {
            url: base_url,
            data: {
                "q": "{{ q }}",
                "r": "{{ r }}",
                "t": "{{ t }}",
                "x": "{{ limit }}",
            }
        };
        var app = new App();
        var client = new app.httpClient();
        var $response = client.get(params);

        $response.done(function() {
            var events = client.getResults();

            console.log("1!")

            var template_params = {
                "template_path": "{{ template_path }}",
                "template_name": "{{ template_name }}",
                "$target_element": $("{{ target_element_selector }}"),
                "data": {
                    events: events,
                    limit: {{ limit }},
                    config: {{ config|json_encode|raw }} // passes Twig config info for use in Nunjucks templates
                }
            };
{# console.log(template_params) #}
            var renderer = new app.renderer();
            renderer.init(template_params);
            renderer.render();
        });
    })();
</script>
{%- endmacro -%}
