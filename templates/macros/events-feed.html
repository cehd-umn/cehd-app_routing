{%- macro events_feed_js(
    t=129,
    limit=4,
    target_element_selector="#events-container",
    template_name="index.html",
    q=6,
    r=3
    ) -%}
<script>
    (function() {
        "use strict";
        var base_url = "/edpsych/services/events/feed/";
        var params = {
            url: base_url,
            data: {
                "q": "{{ q }}",
                "r": "{{ r }}",
                "t": "{{ t }}",
                "x": "{{ limit }}",
            }
        };
        var client = new HTTPClient();
        var $response = client.get(params);

        $response.done(function() {
            var results = client.getResults();
            var events = Helpers.parseEvents(results);
            var template_params = {
                "template_path": "{{ config.nunjucks_view_base }}/edpsych/events/",
                "template_name": "{{ template_name }}",
                "$target_element": $("{{ target_element_selector }}"),
                "data": {
                    events: events,
                    limit: {{ limit }},
                    config: {{ config|json_encode|raw }} // passes Twig config info for use in Nunjucks templates
                }
            };

            var renderer = new Renderer();
            renderer.init(template_params);
            renderer.render();
        });
    })();
</script>
{%- endmacro -%}
