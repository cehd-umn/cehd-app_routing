{%- macro news_feed_js(
    feed_path,
    target_element_selector="#news-container",
    template_name="cehdnews.html",
    limit=3,
    news_site_base_url="http://news.cehd.umn.edu/",
    more_news_text="More news",
    template_path="/assets/dist/views/cehd/newsfeeds/") -%}
<script>
    (function() {
        "use strict";
        var data = {
                "feed-path": "{{ feed_path }}",
                "feed_url": "{{ news_site_base_url }}"
            };
        {% if varargs %}
            {% for arg in varargs %}
                {% for key, value in arg %}
                    data.{{ key }} = "{{ value }}";
                {% endfor %}
            {% endfor %}
        {% endif %}
        var base_url = "/services/news/feed/";
        var params = {
            url: base_url,
            data: data
        };
        var app = new App();
        var client = new app.httpClient();
        var $request = client.get(params);
        var analytics = new app.GA();

        $request.done(function() {
            var results = client.getResults();
            var news_site_base_url = "{{ news_site_base_url }}";
            var news_category_uri = app.helpers.feedPathToLinkPath("{{ feed_path }}");
            var news_link = news_site_base_url + news_category_uri;
            var news_text = "{{ more_news_text }}";
            var $target = $("{{ target_element_selector }}");
            var template_params = {
                "template_path": "{{ template_path }}",
                "template_name": "{{ template_name }}",
                "$target_element": $target,
                "data": {
                    news: results,
                    more_news_link: news_link,
                    more_news_text: news_text,
                    limit: {{ limit }},
                    config: {{ config|json_encode|raw }} // passes Twig config info for use in Nunjucks templates
                }
            };
            var renderer = new app.renderer();
            renderer.init(template_params);
            renderer.render();

            var $ga_elements = analytics.getElementsWithGAData($target);

            if ($ga_elements.length > 0 ) {
                $ga_elements.on("click", analytics.trackingElementClickHandler);
            }
        });
    })();
</script>
{%- endmacro -%}
