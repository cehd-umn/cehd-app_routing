{% extends "cehd/layout/base.html" %}
{% set page_title = "Report an issue" %}
{% block title %}{{ page_title }}{% endblock %}
{% block main_content %}
<div class="row">
  <div class="container">
    <h1>Report an issue</h1>
      <div class="row">
        <div class="span-6 feature">
          <div class="cognito">
              <script src="https://services.cognitoforms.com/s/W-exKdUYPUu0h7yuDFt3rg"></script>
              <script>
                  var url = window.location.search.split("=")[1];
                  var userAgent = window.navigator.userAgent;
                  var width = document.documentElement.clientWidth;
                  var height = document.documentElement.clientHeight;
                  var entry = {
                      "Url": url,
                      "UserAgent": userAgent,
                      "ScreenWidth": width,
                      "ScreenHeight": height
                  };

                  Cognito.load("forms", {
                      id: "85",
                      entry: entry
                  });
              </script>
          </div>
        </div>
      </div>
  </div> <!-- ./container -->
</div> <!-- ./row -->
{% endblock %}
