{% extends "cehd/layout/base.html" %}
{% set page_title = "Search Results" %}
{% block title %}{{ page_title }}{% endblock %}
{% block main_content %}
<!-- Search box in the main area of the page -->
<gcse:searchbox-only resultsURL="{{ config.base }}/search/"></gcse:searchbox-only>

<!-- search filter menu -->
<ul class="search-menu">
  <li class="search-menu__item search_web"><a href="" class="search-menu__link" id="search-web">Web</a></li>
  <li class="search-menu__item search_people"><a href="" class="search-menu__link" id="search-people">People</a></li>
  <li class="search-menu__item search_depts"><a href="" class="search-menu__link" id="search-depts">Directory</a></li>
</ul>

<!-- main container for search results -->
<div class="search-results-area">

  <!-- search results -->
  <gcse:searchresults-only as_oq="site:{{ config.base }}"></gcse:searchresults-only>

    <!-- people search container -->
    <div class='people-search__container'>
        <h2 class='people-search__header h4'>People Search Results</h2>
        <div class="people-search__svg-placeholder active">
            <svg aria-hidden="true" data-prefix="fas" data-icon="spinner" class="svg-inline--fa fa-spinner fa-w-16" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="currentColor" d="M304 48c0 26.51-21.49 48-48 48s-48-21.49-48-48 21.49-48 48-48 48 21.49 48 48zm-48 368c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48-21.49-48-48-48zm208-208c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48-21.49-48-48-48zM96 256c0-26.51-21.49-48-48-48S0 229.49 0 256s21.49 48 48 48 48-21.49 48-48zm12.922 99.078c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48c0-26.509-21.491-48-48-48zm294.156 0c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48c0-26.509-21.49-48-48-48zM108.922 60.922c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48-21.491-48-48-48z"></path></svg>
        </div>
        <div class='people-search__list-container'></div>
    </div>

</div>

<!-- use the cse-results-html.css file to style the results on this page-->
<link href="/cse-results-html.css.css" rel="stylesheet">

<!-- use the cse.min.js file to style the results on this page-->
<script src="/cse.min.js" type="text/javascript"></script>
{% endblock %}
