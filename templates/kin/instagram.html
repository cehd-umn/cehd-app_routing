{% extends "kin/layout/base.html" %}
{% set page_title = "Instagram Feed" %}
{% block title %}
Instagram Feed
{% endblock %}
{% block extra_css %}
{% endblock %}
{% block main_content %}
<div class="row">

  <div class="container">
    <h1>Instagram Feed</h1>
  </div>

  <div class="container">
<div id="instagram-feed"></div>
  </div>

</div>

</div><!-- close row -->

{% endblock %}
{% block bottom_js %}{{ parent() }}
<script src="/assets/InstagramFeed.min.js"></script>
<script>
  (function () {
    new InstagramFeed({
      'username': 'umnkinesiology',
      'container': document.getElementById("instagram-feed"),
      'display_profile': true,
      'display_biography': true,
      'display_gallery': true,
      'callback': null,
      'styling': true,
      'items': 12,
      'items_per_row': 3,
      'margin': .5,
      'lazy_load': true
    });
  })();
</script>

{% endblock %}
