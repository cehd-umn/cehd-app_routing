---
# Use spaces and 4-space indentation. Tab indentation will break this file.
# Also the indentation structure here is #very important#. This will also break
# if things aren't indented with the same pattern. Finally, it's a good idea to
# install a YAML linter to help catch duplicate keys. (Routes are keys in this
# case.)
#
# The preferred style for routes (i.e., /about/) is lowercase, hyphenated,
# unabbreviated words.
#
# Good:
#
# /this/is/a/registration/page/
# /registration-page/
#
# Not so good:
#
# /reg-pg/
# /RegistrationPage/
#
# Try to organize your templates in a way that matches the route. Main section
# templates should be named index.html
#
# Examples:
#
# route: /about/
# template: /about/index.html
#
# route: /really/long/nested/route/
# template: /really/long/nested/route/index.html
#
# route: /really/long/nested/route/sub-section/
# template: /really/long/nested/route/sub-section.html
#
# Be judicious. The goal is to make templates easy to find.
#
####################################
## This system is case-sensitive! ##
####################################

# These routes are going to conflict once I merge this file. Put these in their
# alphabetical spot after merging.
#
# Examples section (note: keep publish "false" for these")
/examples/:
  publish: false
  template: cehd/examples/index.html
  template_data:
    meta_description: null
    section: null
/examples/divider/:
  publish: false
  template: cehd/examples/divider.html
  template_data:
    meta_description: null
    section: null
/examples/macros/:
  publish: false
  template: cehd/examples/macros.html
  template_data:
    meta_description: null
    section: null
/examples/routes/:
  publish: false
  template: cehd/examples/routes.html
  template_data:
    meta_description: null
    section: null

/:
  template: cehd/index.html
  publish: true
  template_data:
    - section: home
/about/:
  publish: true
  template: cehd/about/index.html
  template_data:
    - section: about
/about/diversity/:
  publish: true
  template: cehd/about/diversity.html
  template_data:
    - section: about
