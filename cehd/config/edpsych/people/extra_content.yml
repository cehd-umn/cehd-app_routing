    quote: "The field of educational measurement is concerned with quantifying student abilities and proficiencies to assist in improving learning, instruction, and educational accountability. It is a dynamic and interdisciplinary field that goes beyond pure psychometrics to take into consideration how behavioral, sociocultural, and linguistic factors can influence test performance, which requires a multimethod research perspective. As an educational measurement specialist, my goal is to assist in addressing many of the practical challenges that the field faces as the work that we do can have real-world implications for students, educational stakeholders, and society."
