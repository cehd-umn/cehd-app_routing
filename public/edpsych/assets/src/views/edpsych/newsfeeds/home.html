{% for news_item in data.news %}
    {% if loop.index0 < data.limit %}
        <article class="half">
            <h4 class="light"><a href="{{ news_item.link }}">{{ news_item.title }}</a></h4>
            <div class="span-3">
                {% if news_item.thumbnail %}
                <p><img src="{{ news_item.thumbnail }}" alt="Article image"></p>
                {% endif %}
            </div>
            <div class="span-9">
                <p>{{ news_item.description|safe }}</p>
            </div>
        </article>
    {% endif %}
{% endfor %}
