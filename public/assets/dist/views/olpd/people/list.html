<div class="row">
    {% for person in data.people %}
    <div class="container">

                <div class="feature twothird">
                <h2 class="heading-profile">{{ person.nameFirstLast }}
                    <small class="clear h4">
                    {% if person.workingTitle|is_string %}
                        {{ person.workingTitle|safe }}
                    {% endif %}
                    </small>
                </h2>

<p>{{ person.phone }} | <a href="mailto:{{ person.internetId }}@umn.edu">{{ person.internetId }}@umn.edu</a></p>





            <div class="span-3">
                {% if person.headshotAddress|is_string %}
                    <p class="no-margin-top"><img src="{{ person.headshotAddress }}" alt="{{ person.nameFirstLast }} headshot"></p>
                {% endif %}
            </div>

        </div><!-- end feature.twothird -->

    {% endfor %}
</div><!-- end row.emphasis -->
