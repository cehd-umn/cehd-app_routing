<ul class="no-bullet">
{% for info_session in data.info_sessions %}
    {% if loop.index0 < data.limit %}
        <li><a href="{{ info_session.url }}">{{ info_session.dayOfWeek }}, {{ info_session.fullMonth }} {{ info_session.day }}, {{ info_session.year }}</a> | {{ info_session.startTime }}</li>
    {% endif %}
{% endfor %}
</ul>
