<div class="isotope-sizer"></div>
{% for slug, topic in data.topics %}
    <div id="isotope-item-{{ loop.index }}" class="isotope-item
        {%- if topic.categories_hyphenated -%}
            {{ " " }}{{- topic.categories_hyphenated|join(" ") -}}
            {{- " category" -}}
        {%- endif -%}"{#- close the class= quote -#}
        {%- if topic.categories -%}
            {{ " " }}data-categories="{{- topic.categories|join(" ") }}
            "{#- close the data-categories= quote -#}
        {%- endif -%}
        data-slug="{{ slug }}">{#- close the tag -#}
        <h2 class="h4 title"><a href="{{ slug }}/">{{ topic.keyTitle }}</a></h2>
        <div id="topic-container-{{ topic.tag_id }}" data-tag-id="{{ topic.tag_id }}">
            {% if topic.description %}<p>{{ topic.description }}</p>{% endif %}
        </div>
    </div><!-- / isotope-item -->
{% endfor %}
